events {
    worker_connections 1024;
}

http {
    # MIME types
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        application/javascript                js;
        application/json                      json;
        image/svg+xml                         svg svgz;
        image/x-icon                          ico;
        image/png                             png;
        image/jpeg                            jpeg jpg;
        font/woff                             woff;
        font/woff2                            woff2;
    }
    
    default_type application/octet-stream;
    
    server {
        listen 3000;
        server_name _;

        # Ignore all incoming host headers
        ignore_invalid_headers off;
        
        # API location - prefix match
        location /api {
            # Proxy API requests to backend
            proxy_pass http://127.0.0.1:5001;
            proxy_http_version 1.1;
            proxy_set_header Host "localhost:5001";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            
            # Add CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            
            # Handle preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
        
        # Frontend location - serve static files directly
        location / {
            root "/Volumes/DATA/JIMBARAN HIJAU/Project File/document-management-system/frontend/dist";
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
